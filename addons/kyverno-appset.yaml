apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            fleet: lab
  template:
    metadata:
      name: 'kyverno-{{.name}}'
    spec:
      project: default
      source:
        repoURL: https://kyverno.github.io/kyverno/
        chart: kyverno
        targetRevision: 3.10.0   # replace with the version from helm search
      destination:
        server: '{{.server}}'
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true