apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: web-content
    files:
      - site/index.html
      - site/architecture.html
      - site/policies.html
      - site/style.css
      - site/app.js
  - name: web-env
    files:
      - env.json
